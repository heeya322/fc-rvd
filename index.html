<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#253f8a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="회전문">
<title>FC회전문</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --ink:#16213a; --sub:#5b6680; --line:#dfe4ec; --bg:#f1f4f8; --card:#fff;
  --court:#253f8a; --court2:#2c498b; --bib:#d7141c; --win:#1f9463; --draw:#8a93a6; --loss:#d23f3a;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--court);border-bottom:3px solid var(--bib);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;gap:10px}
header h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.02em;flex:1}
header h1 img{width:30px;height:30px;vertical-align:-8px;margin-right:8px;background:#fff;border-radius:50%}
header .who{font-size:13px;opacity:.85}
header button{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:4px 10px;font-size:12px}
main{max-width:640px;margin:0 auto;padding:14px 14px calc(env(safe-area-inset-bottom) + 90px)}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:10px 0 12px;font-size:12px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button b{font-size:19px;line-height:1}
nav button.on{color:var(--court);font-weight:700}
h2{font-size:17px;margin:22px 2px 10px;font-weight:800;letter-spacing:-.02em}
h2:first-child{margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.muted{color:var(--sub);font-size:13px}
.small{font-size:12px}
.big{font-size:22px;font-weight:800;letter-spacing:-.02em}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font-weight:600}
.btn.primary{background:var(--court);border-color:var(--court);color:#fff}
.btn.bib{background:var(--bib);border-color:var(--bib);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.full{width:100%}
.btn.danger{color:var(--loss)}
.btn:disabled{opacity:.5}
.seg{display:flex;background:#e6ebf2;border-radius:10px;padding:3px;gap:3px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:7px 8px;font-size:13px;white-space:nowrap;color:var(--sub)}
.seg button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(22,33,58,.08)}
.rsvp{display:flex;gap:6px;margin-top:10px}
.rsvp button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 0;font-weight:600}
.rsvp button.yes.on{background:var(--court);border-color:var(--court);color:#fff}
.rsvp button.no.on{background:#4a5470;border-color:#4a5470;color:#fff}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 7px;background:#e6ebf2;color:var(--sub)}
.tag.regular{background:#dde8f7;color:var(--court2)}
.tag.match{background:#fbe1ec;color:#b3245d}
.tag.W{background:#daf1e6;color:var(--win)} .tag.D{background:#eceef2;color:var(--draw)} .tag.L{background:#fbe0df;color:var(--loss)}
.tag.dues{background:#daf1e6;color:var(--win)} .tag.guest{background:#e8e2fb;color:#5b3fc4} .tag.expense{background:#fbe0df;color:var(--loss)}
.tag.unknown{background:#fff0c9;color:#8a6200} .tag.other,.tag.duplicate{background:#eceef2;color:var(--sub)}
.names{font-size:13px;color:var(--sub);margin-top:6px}
.list .item{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
.list .item:last-child{border-bottom:0}
.list .item .grow{flex:1;min-width:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.stats div{background:var(--bg);border-radius:10px;padding:8px 2px}
.stats b{display:block;font-size:20px;font-weight:800}
.stats span{font-size:11px;color:var(--sub)}
/* 스코어보드 */
.board{background:var(--court);color:#fff;border-radius:16px;border-bottom:4px solid var(--bib);padding:16px 14px 18px;margin-bottom:10px;position:relative;overflow:hidden}
.board::before{content:"";position:absolute;left:50%;top:-40px;width:120px;height:120px;margin-left:-60px;border:2px solid rgba(255,255,255,.12);border-radius:50%}
.board::after{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:2px solid rgba(255,255,255,.12)}
.board .meta{position:relative;z-index:1;font-size:12px;opacity:.8;text-align:center}
.board .score{position:relative;z-index:1;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-top:8px}
.board .team{text-align:center;font-size:14px;font-weight:700}
.board .num{font-size:64px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.03em;padding:0 10px}
.board .live{display:inline-block;background:var(--bib);color:#fff;font-weight:800;font-size:11px;border-radius:5px;padding:1px 6px;margin-left:6px}
.board .ctrl{position:relative;z-index:1;display:flex;gap:6px;margin-top:14px}
.board .ctrl button{flex:1;border:0;border-radius:10px;padding:10px 0;font-weight:700;background:rgba(255,255,255,.14);color:#fff}
.board .ctrl button.goal{background:var(--bib)}
label.f{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
input.i,select.i,textarea.i{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
textarea.i{min-height:120px;resize:vertical}
.login{max-width:380px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 60px) 20px 40px}
.login .logo{font-size:30px;font-weight:900;letter-spacing:-.04em;color:var(--court);display:flex;align-items:center;gap:12px}
.login .logo img{width:72px;height:72px}
.login .logo span{color:var(--bib)}
#modal{position:fixed;inset:0;z-index:20;background:rgba(22,33,58,.45);display:none;align-items:flex-end;justify-content:center}
#modal.open{display:flex}
#modal .sheet{background:#fff;width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);max-height:88vh;overflow:auto}
#modal .sheet h3{margin:0 0 6px;font-size:17px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;display:none;max-width:90%}
.chk{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.chk input{width:20px;height:20px;accent-color:var(--court)}
.rank{display:grid;grid-template-columns:28px 1fr auto;gap:6px;padding:6px 2px;font-size:14px}
.rank i{font-style:normal;color:var(--sub)}
.empty{text-align:center;color:var(--sub);padding:18px 0;font-size:14px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--bib);outline-offset:2px}
/* v2 추가 */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .dow{font-size:11px;color:var(--sub);text-align:center;padding:2px 0}
.cal .d{min-height:58px;border-radius:9px;background:var(--bg);padding:4px 3px;font-size:12px;border:1px solid transparent;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.cal .d.out{opacity:.35}
.cal .d.today .n{background:var(--ink);color:#fff;border-radius:6px;padding:0 5px}
.cal .d.sel{border-color:var(--court);background:#e3ebf7}
.cal .d .n{font-weight:700;align-self:flex-start;font-size:12px}
.cal .d .ev{font-size:10px;line-height:1.25;border-radius:4px;padding:1px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .d .ev.regular{background:var(--court);color:#fff}
.cal .d .ev.match{background:var(--bib);color:#fff}
.cal .d .ev.etc{background:#8a93a6;color:#fff}
.cal .sun .n{color:var(--loss)}
.court{width:100%;max-width:340px;display:block;margin:0 auto}
.court text{font-family:inherit}
.court .spot{cursor:pointer}
.pick{max-height:52vh;overflow:auto;margin-top:8px}
.pick button{display:flex;width:100%;justify-content:space-between;border:0;border-bottom:1px solid var(--line);background:#fff;padding:12px 6px;font-size:15px;text-align:left}
.pick button .muted{font-size:12px}
.chipline{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chip{font-size:12px;background:var(--bg);border-radius:999px;padding:2px 9px}
.chip.g{background:#fde4e5;color:#b0121a}
.selbar{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 58px);z-index:6;display:flex;gap:8px;padding:10px 14px;background:#fff;border-top:1px solid var(--line);max-width:640px;margin:0 auto}
.fb{white-space:pre-wrap;background:#fff8e6;border:1px solid #f3dfa6;border-radius:12px;padding:12px;font-size:14px}
.idbox{display:flex;gap:8px;align-items:flex-end}
.idbox input{text-align:center;letter-spacing:.15em;font-weight:700}
.tag.staff{background:#dde8f7;color:var(--court2)} .tag.admin{background:#fbe1ec;color:#b3245d}
.tag.credit{background:#dff3f7;color:#13708a} .tag.scheduled{background:#e6ebf2;color:var(--sub)}
.rsvp button:disabled{opacity:.4}

/* 버튼·입력칸 크기 통일 */
.rankgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rankgrid .card{margin:0;padding:12px}
.rankgrid .rank{grid-template-columns:18px 1fr auto;font-size:13px}
.rankgrid .empty{padding:10px 0;font-size:12px}
.seg.wrap{flex-wrap:wrap;overflow:visible}
.seg.wrap button{flex:1 0 22%}
.btn{white-space:nowrap;flex-shrink:0;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:4px;line-height:1.2}
.btn.sm{min-height:34px}
.btn.full{display:flex}
.row > .i{flex:1;min-width:0}
input.i,select.i{min-height:44px}
.chk input{flex-shrink:0}
.tag{white-space:nowrap}
.item b{white-space:nowrap}
.item .grow b{white-space:normal}
</style>
</head>

<div id="modal"><div class="sheet" id="sheet"></div></div>

function toast(msg, ms = 2600) { const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', ms); }
async function q(p) { const { data, error } = await p; if (error) { toast('오류: ' + error.message, 4500); throw error; } return data; }
async function fetchAll(table, sel = '*') { let out = [], from = 0; for (;;) { const d = await q(sb.from(table).select(sel).range(from, from + 999)); out = out.concat(d); if (d.length < 1000) break; from += 1000; } return out; }

// ===== 회원 고르기 (초성 검색) =====
let pickCb = null;

    <button class="btn full" style="margin-top:10px" onclick="closeModal()">닫기</button>`);

function drawPick() {

function pickDone(v) { const cb = pickCb; if (v.startsWith('__x')) v = S._pickExtras[+v.slice(3)][0]; closeModal(); cb && cb(v); }

// ===== 로그인 (아이디 = 생년 끝 2자리 + 휴대폰 끝 4자리) =====
const toEmail = id => `${id}@${ID_DOMAIN}`;
function idInputs() {

    <div class="idbox"><div style="flex:2"><div class="muted small">생년 끝 2자리</div><input class="i" id="lyy" inputmode="numeric" maxlength="2" placeholder="95" oninput="this.value=this.value.replace(/\\D/g,'');if(this.value.length==2)document.getElementById('lph').focus()"></div>
    <div style="flex:3"><div class="muted small">휴대폰 끝 4자리</div><input class="i" id="lph" inputmode="numeric" maxlength="4" placeholder="1234" oninput="this.value=this.value.replace(/\\D/g,'')"></div></div>`;
}
const loginId = () => { const y = val('lyy'), p = val('lph'); return /^\d{2}$/.test(y) && /^\d{4}$/.test(p) ? y + p : null; };
function renderLogin(mode = 'login') {
  app.innerHTML = `<div class="login">
    <div class="logo"><img src="${LOGO}" alt="FC회전문 로고">FC회전문</div>

    ${mode === 'signup' ? `<label class="f">이름 (실명, 회비 입금자명과 같게)</label><input class="i" id="lname" autocomplete="name">` : ''}
    ${idInputs()}
    <label class="f">비밀번호 (6자 이상)</label><input class="i" id="lpw" type="password" autocomplete="${mode === 'login' ? 'current-password' : 'new-password'}">
    ${mode === 'signup' ? `<label class="f">입단일 (선택, 모르면 비워두기)</label><input class="i" id="ljoin" type="date">` : ''}
    <button class="btn primary full" style="margin-top:16px" onclick="${mode === 'login' ? 'doLogin()' : 'doSignup()'}">${mode === 'login' ? '로그인' : '가입 신청'}</button>
    <p class="muted" style="text-align:center;margin-top:14px">${mode === 'login'

      : `<a href="#" onclick="renderLogin('login');return false">로그인으로 돌아가기</a>`}</p>
    <p class="muted small" style="text-align:center">비밀번호를 잊으면 관리자에게 초기화를 요청하세요.</p></div>`;
}
async function doLogin() {
  const id = loginId(), pw = val('lpw');
  if (!id) return toast('생년 2자리와 휴대폰 끝 4자리를 입력하세요');
  if (!pw) return toast('비밀번호를 입력하세요');
  const { error } = await sb.auth.signInWithPassword({ email: toEmail(id), password: pw });
  if (error) toast(error.message.includes('Invalid') ? '아이디 또는 비밀번호가 맞지 않습니다' : '오류: ' + error.message, 4500);
}
async function doSignup() {
  const name = val('lname').trim(), id = loginId(), pw = val('lpw'), joined = val('ljoin');
  if (!name) return toast('이름을 입력하세요');
  if (!id) return toast('생년 2자리와 휴대폰 끝 4자리를 입력하세요');
  if (pw.length < 6) return toast('비밀번호는 6자 이상');
  const { data, error } = await sb.auth.signUp({ email: toEmail(id), password: pw, options: { data: { login_id: id, name, joined_on: joined || '' } } });
  if (error) return toast(error.message.includes('registered') ? `이미 있는 아이디(${id})입니다. 관리자에게 문의하세요` : '오류: ' + error.message, 5000);
  if (!data.session) { toast('가입 완료. 로그인하세요', 4000); renderLogin('login'); }
}
async function logout() { await sb.auth.signOut(); }

// ===== 시작 =====
let starting = false;
sb.auth.onAuthStateChange((ev, session) => {
  if (!session) { S.me = null; if (S.ch) { sb.removeChannel(S.ch); S.ch = null; } renderLogin(); return; }
  if (S.me && S.me.id === session.user.id) return;
  setTimeout(start, 0);
});
async function start() {
  if (starting) return; starting = true;
  try {
    const { data: { user } } = await sb.auth.getUser();
    if (!user) { renderLogin(); return; }
    let me = null;
    for (let i = 0; i < 3 && !me; i++) { me = await q(sb.from('members').select('*').eq('id', user.id).maybeSingle()); if (!me) await new Promise(r => setTimeout(r, 700)); }
    if (!me || !me.approved || !me.active) {
      const msg = me && me.approved && !me.active ? '탈퇴 처리된 계정입니다. 문의는 운영진에게 해주세요.' : '운영진이 가입을 승인하면 사용할 수 있습니다. 승인 후 새로고침하세요.';
      app.innerHTML = `<div class="login"><div class="logo"><img src="${LOGO}" alt="FC회전문 로고">FC회전문</div><div class="card" style="margin-top:20px"><b>${me && me.approved ? '이용 불가' : '승인 대기 중'}</b><p class="muted">${msg}</p><div class="row"><button class="btn" onclick="location.reload()">새로고침</button><button class="btn" onclick="logout()">로그아웃</button></div></div></div>`;
      return;
    }
    S.me = me;
    await refresh();
    if (['staff','admin'].includes(me.role)) { const { count } = await sb.from('suggestions').select('id', { count: 'exact', head: true }).eq('status', 'new'); S.newVoice = count || 0; }
    renderShell();
    subscribe();
  } finally { starting = false; }
}
const sortAll = () => {
  S.events.sort((a, b) => new Date(a.starts_at) - new Date(b.starts_at));
  S.matches.sort((a, b) => new Date(b.played_at) - new Date(a.played_at));
  S.members.sort((a, b) => a.name.localeCompare(b.name, 'ko'));
};
async function refresh() {
  [S.members, S.events, S.rsvps, S.att, S.guests, S.matches, S.goals, S.lineups, S.fines, S.notices] = await Promise.all(
    ['members','events','rsvps','attendance','event_guests','matches','goals','lineups','fines','notices'].map(t => fetchAll(t)));
  sortAll();
  S.me = S.members.find(m => m.id === S.me.id) || S.me;
}
function subscribe() {
  if (S.ch) return;
  let timer; const keys = { goals:'goals', matches:'matches', rsvps:'rsvps', lineups:'lineups', event_guests:'guests', attendance:'att', fines:'fines', notices:'notices' };
  const reload = t => { clearTimeout(timer); timer = setTimeout(async () => { S[keys[t]] = await fetchAll(t); sortAll(); if (!modalOpen()) renderTab(); }, 300); };
  let ch = sb.channel('fc-live');
  Object.keys(keys).forEach(t => { ch = ch.on('postgres_changes', { event: '*', schema: 'public', table: t }, () => reload(t)); });
  S.ch = ch.subscribe();
}

// ===== 화면 틀 =====
function renderShell() {
  const tabs = [['home','⌂','홈'],['events','◷','일정'],['matches','⚽','경기'],['dues','₩','회비']];
  if (isStaff()) tabs.push(['admin','⚙',`관리${S.newVoice ? ' •' : ''}`]);
  app.innerHTML = `<header><h1><img src="${LOGO}" alt="">FC회전문</h1><div class="who">${esc(S.me.name)}${S.me.role !== 'member' ? ' · ' + ROLE[S.me.role] : ''}</div><button onclick="logout()">로그아웃</button></header>
    <main id="main"></main>
    <nav>${tabs.map(([k, i, l]) => `<button data-tab="${k}" onclick="go('${k}')"><b>${i}</b>${l}</button>`).join('')}</nav>`;
  renderTab();
}
function go(tab) { S.tab = tab; S.selMode = false; S.sel.clear(); S.mSel = false; if (tab !== 'matches') S.openMatch = null; renderTab(); window.scrollTo(0, 0); }
function renderTab() {
  const main = document.getElementById('main'); if (!main) return;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === S.tab));
  ({ home: renderHome, events: renderEvents, matches: renderMatches, dues: renderDues, admin: renderAdmin }[S.tab] || renderHome)(main);
}
async function reloadAndRender(...tables) {
  const map = { members:'members', events:'events', rsvps:'rsvps', attendance:'att', event_guests:'guests', matches:'matches', goals:'goals', lineups:'lineups', fines:'fines', notices:'notices' };
  await Promise.all(tables.map(async t => { S[map[t]] = await fetchAll(t); })); sortAll(); renderTab();
}

// ===== 계산 =====
const evById = id => S.events.find(e => e.id === id);
// 경기: 출전 = 출전 체크 + 출전 명단(쿼터)에 들어간 사람 / 응원 = 응원 체크 중 출전 안 한 사람
function playedOf(eid) {
  const set = new Set(S.att.filter(a => a.event_id === eid && !a.cheer).map(a => a.member_id));
  const mt = S.matches.find(m => m.event_id === eid); if (mt) S.lineups.filter(l => l.match_id === mt.id).forEach(l => set.add(l.member_id));
  return set;
}
function cheerOf(eid) { const p = playedOf(eid); return new Set(S.att.filter(a => a.event_id === eid && a.cheer && !p.has(a.member_id)).map(a => a.member_id)); }
function statsFor(id) {
  const reg = new Set(S.events.filter(e => e.kind === 'regular').map(e => e.id));
  const mine = S.att.filter(a => a.member_id === id && reg.has(a.event_id));
  const cm = ym();
  const month = mine.filter(a => ym(new Date(evById(a.event_id).starts_at)) === cm).length;
  const m = S.members.find(x => x.id === id);
  const since = m?.joined_on ? new Date(m.joined_on) : m ? new Date(m.created_at) : new Date(0);
  const held = S.events.filter(e => e.kind === 'regular' && new Date(e.starts_at) >= since && new Date(e.starts_at) < new Date() && S.att.some(a => a.event_id === e.id)).length;
  const qs = new Set(S.lineups.filter(l => l.member_id === id).map(l => l.match_id + '-' + l.quarter)).size;
  return { total: mine.length, month, rate: held ? Math.min(100, Math.round(mine.length / held * 100)) : 0,
    goals: S.goals.filter(g => g.scorer_id === id && !g.own_goal).length, assists: S.goals.filter(g => g.assist_id === id).length, quarters: qs };
}
function matchScore(mt) { const ours = S.goals.filter(g => g.match_id === mt.id).length; const res = ours > mt.their_score ? 'W' : ours < mt.their_score ? 'L' : 'D'; return { ours, theirs: mt.their_score, res }; }
function record() { let w = 0, d = 0, l = 0, gf = 0, ga = 0; S.matches.filter(m => m.status === 'done').forEach(m => { const s = matchScore(m); gf += s.ours; ga += s.theirs; s.res === 'W' ? w++ : s.res === 'L' ? l++ : d++; }); return { n: w + d + l, w, d, l, gf, ga }; }
function joinedText(m) {
  if (!m.joined_on) return '';
  const j = new Date(m.joined_on + 'T00:00:00+09:00'); const now = new Date();
  const months = (now.getFullYear() - j.getFullYear()) * 12 + (now.getMonth() - j.getMonth());
  return `${m.joined_on.slice(0, 4)}.${Number(m.joined_on.slice(5, 7))}.${Number(m.joined_on.slice(8))} 입단${months >= 1 ? ` · ${months >= 12 ? Math.floor(months / 12) + '년 ' + (months % 12 ? months % 12 + '개월' : '') : months + '개월'}` : ''}`;
}

// ===== 일정 카드 =====
function eventCard(e) {
  const rs = S.rsvps.filter(r => r.event_id === e.id);
  const yes = rs.filter(r => r.status === 'attend'), no = rs.filter(r => r.status === 'absent'), may = rs.filter(r => r.status === 'maybe');
  const mine = rs.find(r => r.member_id === S.me.id)?.status;
  const past = new Date(e.starts_at) < Date.now() - 3 * 3600e3;
  const dl = deadlineOf(e); const closed = dl && Date.now() > dl;
  const lockAll = closed && mine !== 'maybe';
  const ef = S.fines.filter(f => f.event_id === e.id);
  const att = S.att.filter(a => a.event_id === e.id);
  const gs = S.guests.filter(g => g.event_id === e.id);
  const pending = actives().length - yes.length - no.length - may.length;
  const mt = e.kind === 'match' ? S.matches.find(m => m.event_id === e.id) : null;
  const attLabel = e.kind === 'regular' ? '출석' : e.kind === 'match' ? '출전·응원' : '참여';
  const head = past && att.length ? att.length : yes.length;
  return `<div class="card">
    <div class="row between"><span class="tag ${e.kind}">${KIND[e.kind]}</span>
      <span class="muted small">총 ${head + gs.length}명${gs.length ? ` (게스트 ${gs.length})` : ''}</span></div>
    <div style="font-weight:800;font-size:16px;margin-top:6px">${esc(e.title)}${e.kind === 'match' && e.opponent ? ` <span class="muted">vs ${esc(e.opponent)}</span>` : ''}</div>
    <div class="muted">${fmt(e.starts_at)}${e.place ? ' · ' + esc(e.place) : ''}${e.tournament ? ' · ' + esc(e.tournament) : ''}</div>
    ${e.memo ? `<div class="small" style="margin-top:4px">${esc(e.memo)}</div>` : ''}
    ${past ? '' : `<div class="rsvp"><button class="yes ${mine === 'attend' ? 'on' : ''}" ${lockAll ? 'disabled' : ''} onclick="rsvp(${e.id},'attend')">참석 ${yes.length}</button><button class="no ${mine === 'maybe' ? 'on' : ''}" ${closed ? 'disabled' : ''} onclick="rsvp(${e.id},'maybe')">미정 ${may.length}</button><button class="no ${mine === 'absent' ? 'on' : ''}" ${lockAll ? 'disabled' : ''} onclick="rsvp(${e.id},'absent')">불참 ${no.length}</button></div>
      ${dl ? `<div class="muted small" style="margin-top:4px">${closed ? (mine === 'maybe' ? '마감됨 · 미정이라 참석/불참으로 바꿀 수 있어요' : '오후 6:30 투표 마감') : '당일 오후 6:30 마감 · 무응답 불참 1만원, 8:10 이후 지각 5천원'}</div>` : ''}`}
    <div class="names">
      ${att.length ? (e.kind === 'match' ? (() => { const p = [...playedOf(e.id)], c = [...cheerOf(e.id)]; return `${p.length ? `출전(${p.length}): ${p.map(id => esc(nameOf(id))).join(', ')}<br>` : ''}${c.length ? `응원(${c.length}): ${c.map(id => esc(nameOf(id))).join(', ')}<br>` : ''}`; })() : `${attLabel}(${att.length}): ${att.map(a => esc(nameOf(a.member_id))).join(', ')}<br>`) : ''}
      ${!att.length || !past ? (yes.length ? `참석(${yes.length}): ${yes.map(r => esc(nameOf(r.member_id))).join(', ')}` : '참석 투표 없음') : ''}
      ${no.length && !past ? `<br>불참(${no.length}): ${no.map(r => esc(nameOf(r.member_id))).join(', ')}` : ''}
      ${may.length && !past ? `<br>미정(${may.length}): ${may.map(r => esc(nameOf(r.member_id))).join(', ')}` : ''}
      ${ef.length ? `<br><span style="color:var(--loss)">벌금 ${ef.filter(f => !f.waived).length}건</span>` : ''}
      ${!past && pending > 0 ? `<br>미응답 ${pending}명` : ''}
      ${gs.length ? `<div class="chipline">${gs.map(g => `<span class="chip g">게스트 ${esc(g.name)}${g.member_id ? ' → 가입' : ''}</span>`).join('')}</div>` : ''}
    </div>
    <div class="row" style="margin-top:10px;flex-wrap:wrap">
      <button class="btn sm" onclick="shareEvent(${e.id})">단톡방 공유</button>
      ${mt ? `<button class="btn sm bib" onclick="openMatchView(${mt.id})">경기 보기</button>` : ''}
      ${isStaff() ? `<button class="btn sm" onclick="attendanceModal(${e.id})">${attLabel} ${past ? '입력' : '체크'}</button><button class="btn sm" onclick="guestModal(${e.id})">게스트</button>${past && e.kind === 'regular' ? `<button class="btn sm" onclick="makeFines(${e.id})">벌금 정리</button>` : ''}<button class="btn sm" onclick="eventModal(${e.id})">수정</button>` : ''}
    </div></div>`;
}
async function rsvp(eid, status) {
  await q(sb.rpc('set_rsvp', { p_event: eid, p_status: status }));
  await reloadAndRender('rsvps');
}
async function makeFines(eid) {
  if (!confirm('출석 기록 기준으로 벌금을 정리할까요?\n무응답 불참·참석 후 불참·당일 취소 1만원, 지각 5천원. 휴식회원·감독 제외.\n(출석 입력과 지각 체크를 먼저 해주세요)')) return;
  const n = await q(sb.rpc('generate_event_fines', { p_event: eid })); toast(`벌금 ${n}건 추가. 관리 → 벌금에서 면제 처리할 수 있어요`, 4000); await reloadAndRender('fines');
}

}
function openMatchView(id) { S.tab = 'matches'; S.openMatch = id; S.quarter = 1; S.extraQ = 0; renderTab(); window.scrollTo(0, 0); }

// ===== 홈: 달력 =====
function calendarHtml() {
  const m = S.calMonth || ym(); S.calMonth = m;
  const [y, mo] = m.split('-').map(Number);
  const startDow = new Date(Date.UTC(y, mo - 1, 1)).getUTCDay(), days = new Date(Date.UTC(y, mo, 0)).getUTCDate();
  const today = kst(Date.now()).date;
  const byDay = {}; S.events.forEach(e => { const k = kst(e.starts_at).date; (byDay[k] = byDay[k] || []).push(e); });
  let cells = '';
  for (let i = 0; i < startDow; i++) cells += `<div class="d out"></div>`;
  for (let d = 1; d <= days; d++) {
    const key = `${m}-${String(d).padStart(2, '0')}`; const evs = byDay[key] || [];
    const dow = (startDow + d - 1) % 7;
    cells += `<div class="d ${key === today ? 'today' : ''} ${key === S.calDay ? 'sel' : ''} ${dow === 0 ? 'sun' : ''}" onclick="S.calDay='${key}';renderTab()"><span class="n">${d}</span>${evs.map(e => {
      const n = (new Date(e.starts_at) < Date.now() - 3 * 3600e3 && S.att.some(a => a.event_id === e.id)) ? S.att.filter(a => a.event_id === e.id).length : S.rsvps.filter(r => r.event_id === e.id && r.status === 'attend').length;
      const g = S.guests.filter(x => x.event_id === e.id).length;
      return `<span class="ev ${e.kind}">${e.kind === 'regular' ? '정기' : e.kind === 'match' ? '경기' : '기타'} ${n + g}</span>`; }).join('')}</div>`;
  }
  return `<div class="card"><div class="row between" style="margin-bottom:8px"><button class="btn sm" onclick="S.calMonth=addMonth(S.calMonth,-1);renderTab()">◀</button><b>${y}년 ${mo}월</b><button class="btn sm" onclick="S.calMonth=addMonth(S.calMonth,1);renderTab()">▶</button></div>

async function addGuest(eid, name) {

async function guestPaid(id, eid, v) { await q(sb.from('event_guests').update({ paid: v }).eq('id', id)); S.guests = await fetchAll('event_guests'); guestModal(eid); }
async function guestFee(id, eid, fee) { await q(sb.from('event_guests').update({ fee }).eq('id', id)); S.guests = await fetchAll('event_guests'); guestModal(eid); }

function renderMatches(main) {
  if (S.openMatch) return renderMatchDetail(main, S.openMatch);
  const r = record();
  const rankRows = arr => arr.length ? arr.map(([id, n], i) => `<div class="rank"><i>${i + 1}</i><span>${esc(nameOf(id))}</span><b>${n}</b></div>`).join('') : `<div class="empty">기록 없음</div>`;
  const cnt = f => { const c = {}; S.goals.forEach(g => { const id = f(g); if (id) c[id] = (c[id] || 0) + 1; }); return Object.entries(c).sort((a, b) => b[1] - a[1]).slice(0, 5); };
  const attCnt = {}; const inc = (o, id) => { o[id] = (o[id] || 0) + 1; };
  S.att.filter(a => evById(a.event_id)?.kind === 'regular').forEach(a => inc(attCnt, a.member_id));
  const cheer = {};
  S.events.filter(e => e.kind === 'match').forEach(e => { playedOf(e.id).forEach(id => inc(attCnt, id)); cheerOf(e.id).forEach(id => inc(cheer, id)); });
  const attRank = Object.entries(attCnt).filter(([id]) => players().some(p => p.id === id)).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([id, n]) => [id, n + '회']);
  const cheerRank = Object.entries(cheer).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([id, n]) => [id, n + '회']);
  const tagOf = m => m.status === 'live' ? ['match', 'LIVE'] : m.status === 'scheduled' ? ['scheduled', '예정'] : [matchScore(m).res, { W: '승', D: '무', L: '패' }[matchScore(m).res]];
  main.innerHTML = `
    <div class="card"><div class="big">${r.n}전 ${r.w}승 ${r.d}무 ${r.l}패</div><div class="muted">득점 ${r.gf} · 실점 ${r.ga} (종료된 경기 기준)</div></div>
    ${isStaff() ? `<div class="row"><button class="btn primary" style="flex:1" onclick="eventModal();document.getElementById('ek').value='match';document.getElementById('ek').onchange()">+ 경기 추가</button><button class="btn ${S.mSel ? 'danger' : ''}" onclick="S.mSel=!S.mSel;S.msel=new Set();renderTab()">${S.mSel ? '선택 취소' : '선택 삭제'}</button></div>` : ''}
    <h2>경기</h2>
    ${S.mSel ? `<div class="card row between" style="border-color:var(--loss)"><span class="small">지울 경기를 체크하세요 · <b id="mselN">${S.msel.size}</b>개 선택</span><button class="btn sm danger" onclick="bulkDeleteMatches()">삭제</button></div>` : ''}
    <div class="card list">${S.matches.length ? S.matches.map(m => { const s = matchScore(m); const [c, l] = tagOf(m); return `<div class="item" onclick="${S.mSel ? `this.querySelector('input').click()` : `openMatchView(${m.id})`}">${S.mSel ? `<input type="checkbox" style="width:20px;height:20px;accent-color:var(--loss)" ${S.msel.has(m.id) ? 'checked' : ''} onclick="event.stopPropagation();this.checked?S.msel.add(${m.id}):S.msel.delete(${m.id});document.getElementById('mselN').textContent=S.msel.size">` : ''}<span class="tag ${c}">${l}</span><div class="grow"><b>vs ${esc(m.opponent)}</b><div class="muted small">${fmt(m.played_at)} · ${m.kind === 'tournament' ? '대회' + (m.tournament ? ' ' + esc(m.tournament) : '') : '친선'}</div></div><b style="font-size:18px">${m.status === 'scheduled' ? '-' : s.ours + ':' + s.theirs}</b></div>`; }).join('') : `<div class="empty">경기 기록이 없습니다</div>`}</div>
    <h2>순위</h2>
    <div class="rankgrid">
      <div class="card"><b>⚽ 득점</b>${rankRows(cnt(g => g.own_goal ? null : g.scorer_id))}</div>
      <div class="card"><b>🅰️ 도움</b>${rankRows(cnt(g => g.assist_id))}</div>
      <div class="card"><b>📣 응원</b>${rankRows(cheerRank)}</div>
      <div class="card"><b>✅ 출석</b>${rankRows(attRank)}</div>
    </div>
    <p class="muted small">응원: 경기에 안 뛰고 응원 온 횟수 · 출석: 정기모임 출석 + 경기 출전 횟수</p>`;
}

    </div>

    <h2>골 기록</h2>
    <div class="card list">${gl.length ? gl.map((g, i) => `<div class="item"><b>${i + 1}</b><div class="grow">${g.quarter ? `<span class="tag">${g.quarter}Q</span> ` : ''}${g.own_goal ? '상대 자책골' : esc(nameOf(g.scorer_id))}${g.assist_id ? `<span class="muted"> (어시 ${esc(nameOf(g.assist_id))})</span>` : ''}</div>${st ? `<button class="btn sm danger" onclick="delGoal(${g.id})">삭제</button>` : ''}</div>`).join('') : `<div class="empty">아직 우리 골이 없습니다</div>`}
      ${st && !live && m.status === 'done' ? `<button class="btn sm" style="margin-top:8px" onclick="addGoal(${id})">+ 골 추가(사후 입력)</button>` : ''}</div>
    <h2>쿼터별 출전 명단</h2>
    <div class="seg">${qs.map(n => `<button class="${S.quarter === n ? 'on' : ''}" onclick="S.quarter=${n};renderTab()">${n}Q</button>`).join('')}${st ? `<button onclick="S.extraQ++;S.quarter=${maxQ + 1};renderTab()">+</button>` : ''}</div>

async function bulkDeleteMatches() {
  if (!S.msel.size) return toast('삭제할 경기를 체크하세요');
  const ms = S.matches.filter(m => S.msel.has(m.id));
  if (!confirm(`경기 ${ms.length}개를 삭제할까요?\n골·출전 명단·감독 피드백과 연결된 경기 일정도 함께 지워지고 되돌릴 수 없습니다.`)) return;
  const ev = ms.filter(m => m.event_id).map(m => m.event_id), mo = ms.filter(m => !m.event_id).map(m => m.id);
  if (ev.length) await q(sb.from('events').delete().in('id', ev));
  if (mo.length) await q(sb.from('matches').delete().in('id', mo));
  S.mSel = false; S.msel = new Set(); toast('삭제했습니다'); await refresh(); renderTab();
}
async function deleteMatch(id) {
  const m = S.matches.find(x => x.id === id); if (!m) return;
  const g = S.goals.filter(x => x.match_id === id).length;
  if (!confirm(`vs ${m.opponent} 경기를 삭제할까요?\n골 ${g}개, 출전 명단, 감독 피드백도 함께 지워지고 되돌릴 수 없습니다.${m.event_id ? '\n일정 탭의 경기 일정도 같이 삭제됩니다.' : ''}`)) return;
  if (m.event_id) await q(sb.from('events').delete().eq('id', m.event_id));
  else await q(sb.from('matches').delete().eq('id', id));
  S.openMatch = null; toast('경기를 삭제했습니다'); await refresh(); renderTab();
}
function addGoal(mid) {
  const inQ = S.lineups.filter(l => l.match_id === mid && l.quarter === S.quarter).map(l => l.member_id);
  const list = players().map(p => ({ ...p, sub: inQ.includes(p.id) ? `${S.quarter}Q 출전 중` : POS[p.position] })).sort((a, b) => inQ.includes(b.id) - inQ.includes(a.id));
  pickMember(`${S.quarter}Q 득점자`, list, [['own', '상대 자책골']], scorer => {
    if (scorer === 'own') return saveGoal(mid, null, null, true);
    pickMember('어시스트', list.filter(p => p.id !== scorer), [['', '어시스트 없음']], assist => saveGoal(mid, scorer, assist || null, false));
  });
}
async function saveGoal(mid, scorer, assist, own) {
  await q(sb.from('goals').insert({ match_id: mid, scorer_id: scorer, assist_id: assist, own_goal: own, quarter: S.quarter }));
  toast('골 기록'); await reloadAndRender('goals');
}
async function delGoal(id) { if (!confirm('이 골 기록을 삭제할까요?')) return; await q(sb.from('goals').delete().eq('id', id)); await reloadAndRender('goals'); }
async function theirGoal(mid, k) { const m = S.matches.find(x => x.id === mid); const v = Math.max(0, m.their_score + k); await q(sb.from('matches').update({ their_score: v }).eq('id', mid)); m.their_score = v; renderTab(); }
async function setMatchStatus(mid, st) { await q(sb.from('matches').update({ status: st }).eq('id', mid)); S.matches.find(x => x.id === mid).status = st; toast(st === 'live' ? '경기 시작' : st === 'done' ? '경기 종료' : '변경'); renderTab(); }
function assignSpot(mid, qn, pos) {
  const lu = S.lineups.filter(l => l.match_id === mid && l.quarter === qn);
  const label = SPOTS.find(s => s[0] === pos)[1];
  const list = players().map(p => { const at = lu.find(l => l.member_id === p.id); return { ...p, sub: at ? SPOTS.find(s => s[0] === at.position)[1] + ' 배치됨' : POS[p.position] }; });
  pickMember(`${qn}Q ${label}`, list, [['__clear', '이 자리 비우기']], async v => {
    if (v === '__clear') { await q(sb.from('lineups').delete().eq('match_id', mid).eq('quarter', qn).eq('position', pos)); }
    else {
      await q(sb.from('lineups').delete().eq('match_id', mid).eq('quarter', qn).eq('member_id', v));
      await q(sb.from('lineups').upsert({ match_id: mid, quarter: qn, position: pos, member_id: v }));
    }
    await reloadAndRender('lineups');
  });
}
async function copyLineup(mid, qn) {
  if (qn < 2) return;
  const prev = S.lineups.filter(l => l.match_id === mid && l.quarter === qn - 1);
  if (!prev.length) return toast(`${qn - 1}Q 명단이 없습니다`);
  await q(sb.from('lineups').delete().eq('match_id', mid).eq('quarter', qn));
  await q(sb.from('lineups').insert(prev.map(l => ({ match_id: mid, quarter: qn, position: l.position, member_id: l.member_id }))));
  await reloadAndRender('lineups');
}
async function clearLineup(mid, qn) { if (!confirm(`${qn}Q 명단을 비울까요?`)) return; await q(sb.from('lineups').delete().eq('match_id', mid).eq('quarter', qn)); await reloadAndRender('lineups'); }
function feedbackModal(mid) {
  const m = S.matches.find(x => x.id === mid);
  openModal(`<h3>감독 피드백</h3><p class="muted small">vs ${esc(m.opponent)} · 모든 회원이 볼 수 있습니다.</p><textarea class="i" id="fbt" style="min-height:200px">${esc(m.feedback || '')}</textarea>

  ['event_guests', '게스트'], ['matches', '경기'], ['goals', '골'], ['lineups', '출전명단'], ['monthly_status', '월상태'],
  ['dues', '회비'], ['transactions', '입출금'], ['fines', '벌금'], ['notices', '공지'], ['suggestions', '소리함'], ['notification_log', '알림기록']
];
function loadXlsx() {
  return window.XLSX ? Promise.resolve() : new Promise((ok, no) => { const sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'; sc.onload = ok; sc.onerror = () => no(new Error('엑셀 도구를 불러오지 못했습니다')); document.head.appendChild(sc); });
}
async function doBackup() {
  const btn = document.getElementById('bkbtn'); if (btn) { btn.disabled = true; btn.textContent = '백업 만드는 중…'; }
  try {
    await loadXlsx();
    const names = {}; (await fetchAll('members')).forEach(m => names[m.id] = m.name);
    const idCols = ['member_id', 'scorer_id', 'assist_id'];
    const wb = XLSX.utils.book_new(); let total = 0;
    for (const [t, label] of BACKUP) {
      let rows = [];
      try { rows = await fetchAll(t); } catch (e) { rows = [{ 오류: e.message }]; }
      rows = rows.map(r => { const o = {}; Object.entries(r).forEach(([k, v]) => { o[k] = v && typeof v === 'object' ? JSON.stringify(v) : v; if (t !== 'members' && idCols.includes(k) && names[v]) o[k + '_이름'] = names[v]; }); return o; });
      total += rows.length;
      XLSX.utils.book_append_sheet(wb, rows.length ? XLSX.utils.json_to_sheet(rows) : XLSX.utils.aoa_to_sheet([['기록 없음']]), label);
    }
    const d = kst(Date.now()).date;
    XLSX.writeFile(wb, `FC회전문_백업_${d}.xlsx`);
    try { localStorage.setItem('fc_last_backup', d); } catch (e) {}
    toast(`백업 완료 (${total}건). 다운로드 폴더를 확인하세요`, 4500);
  } catch (e) { toast('백업 실패: ' + e.message, 5000); }
  if (btn) { btn.disabled = false; btn.textContent = '전체 데이터 백업 (엑셀)'; }
  renderTab();
}
function lastBackup() { try { return localStorage.getItem('fc_last_backup'); } catch (e) { return null; } }
async function adminSettings(el) {
  const s = await q(sb.from('app_settings').select('*'));
  const secret = s.find(x => x.key === 'ingest_secret')?.value || '';
  const lb = lastBackup(); const old = !lb || (Date.now() - new Date(lb + 'T00:00:00+09:00')) > 90 * 864e5;
  el.innerHTML = `<div class="card" ${old ? 'style="border-color:var(--loss)"' : ''}><b>데이터 백업</b><p class="muted small">회원·일정·출석·회비·입출금·벌금·경기 기록 등 모든 데이터를 엑셀 파일 하나로 내려받습니다(표마다 시트 1개). 분기에 한 번 정도 받아서 구글 드라이브 등에 보관하세요.</p>
    <div class="small" style="margin-bottom:8px">${lb ? `마지막 백업: ${lb}` : '이 폰에서 백업한 기록 없음'}${old ? ' · <b style="color:var(--loss)">백업할 때가 됐어요</b>' : ''}</div>
    <button class="btn primary full" id="bkbtn" onclick="doBackup()">전체 데이터 백업 (엑셀)</button></div>
    <div class="card"><b>MacroDroid 자동 전송 정보</b><p class="muted small">MacroDroid의 HTTP 요청 설정에 사용합니다. 비밀키는 다른 사람에게 보이지 않게 하세요.</p>
    <label class="f">요청 주소</label><input class="i" readonly value="${esc(SUPABASE_URL)}/rest/v1/rpc/ingest_notification" onclick="this.select()">
    <label class="f">비밀키 (p_secret)</label><input class="i" readonly value="${esc(secret)}" onclick="this.select()"></div>
    <div class="card"><b>앱 주소</b><p class="muted small">회원들에게 공유하고, 폰 브라우저 메뉴에서 "홈 화면에 추가"를 누르게 하세요.</p><input class="i" readonly value="${esc(appUrl())}" onclick="this.select()"></div>`;
}

</script>
